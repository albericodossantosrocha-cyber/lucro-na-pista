name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Organizar arquivos
        run: |
          mkdir -p www scripts assinatura
          [ -f index.html ] && mv index.html www/ || true
          [ -f icones.py ] && mv icones.py scripts/ || true
          [ -f preparar-android.sh ] && mv preparar-android.sh scripts/ || true
          [ -f lucro-na-pista.keystore ] && mv lucro-na-pista.keystore assinatura/ || true

      - name: Instalar dependências
        run: |
          npm install
          pip install pillow

      - name: Criar projeto Android
        run: |
          npx cap add android
          bash scripts/preparar-android.sh
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../lucro-na-pista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lucro-na-pista-apk
          path: lucro-na-pista.apk
