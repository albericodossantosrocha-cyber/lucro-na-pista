          ls -R /tmp/lnp | head -30

      - name: Instalar dependencias
        working-directory: /tmp/lnp
        run: |
          npm install
          pip install pillow

      - name: Criar projeto Android
        working-directory: /tmp/lnp
        run: |
          set -e
          npx cap add android
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application#' $MAN
          cat >> android/app/build.gradle <<'EOF_GR'
          android {
              signingConfigs {
                  fixa {
                      storeFile file('../../assinatura/lucro-na-pista.keystore')
                      storePassword 'lucronapista'
                      keyAlias 'lucro'
                      keyPassword 'lucronapista'
                  }
              }
              defaultConfig {
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              buildTypes {
                  release { signingConfig signingConfigs.fixa; minifyEnabled false }
                  debug { signingConfig signingConfigs.fixa }
              }
          }
          EOF_GR
          python3 scripts/icones.py android/app/src/main/res
          npx cap sync android

      - name: Compilar APK
        working-directory: /tmp/lnp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/lucro-na-pista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lucro-na-pista-apk
          path: lucro-na-pista.apk
