<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="color-scheme" content="dark">
<title>Lucro na Pista</title>
<style>
:root{
  --bg:#0B0E13;--s1:#141922;--s2:#1B2230;--s3:#273142;--line:#2A3446;
  --tx:#EEF2F7;--tx2:#A3AEC0;--tx3:#6E7A8E;
  --brand:#FF8A3D;--brand2:#FFB27F;--brandbg:rgba(255,138,61,.14);
  --ok:#22C55E;--okbg:rgba(34,197,94,.13);--oktx:#7EE2A2;
  --warn:#FACC15;--warnbg:rgba(250,204,21,.12);--warntx:#FDE68A;
  --bad:#F43F5E;--badbg:rgba(244,63,94,.13);--badtx:#FDA4B4;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* topo */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(11,14,19,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1.5px solid var(--line);background:var(--s2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--tx3)}
.pill.on{border-color:var(--ok);color:var(--oktx)} .pill.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.pill.pause{border-color:var(--warn);color:var(--warntx)} .pill.pause .dot{background:var(--warn)}
#movendo{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:19;background:var(--bad);color:#fff;font-weight:800;text-align:center;padding:10px 16px;font-size:15px}
#movendo[hidden]{display:none}

main{padding:14px 16px 28px;max-width:560px;margin:0 auto}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card.center{text-align:center}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);font-weight:800;margin-bottom:12px}
h3{font-size:19px;margin-bottom:6px}
.lbl{font-size:13px;color:var(--tx2);margin:14px 0 8px;font-weight:600}
.muted{color:var(--tx2)} .faint{color:var(--tx3)} .small{font-size:14px} .tiny{font-size:12.5px}
.mt{margin-top:12px} .mb{margin-bottom:12px}
p+p{margin-top:8px}
.big{font-size:46px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px;font-weight:600}
input,select{width:100%;height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);color:var(--tx);font-size:23px;font-weight:800;padding:0 14px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
select{font-size:17px;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
input.sm,select.sm{height:50px;font-size:17px;font-weight:700;border-radius:12px;padding:0 12px}
input.huge{height:72px;font-size:36px;text-align:center}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
input::placeholder{color:var(--tx3);font-weight:600}
.tog{display:flex;align-items:center;gap:12px;margin-top:14px;font-weight:700;font-size:16px}
.tog input{width:26px;height:26px;accent-color:var(--brand);-webkit-appearance:auto;appearance:auto;flex:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:14px;border:0;font-size:18px;font-weight:800;background:var(--s3);color:var(--tx);width:100%;padding:0 14px;text-align:center;line-height:1.15}
.btn:active,.chip:active,.appbtn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:#241002}
.btn.ok{background:var(--ok);color:#04230F}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.xl{min-height:72px;font-size:22px;margin-top:16px}
.btn.slim{min-height:44px;font-size:15px;border-radius:12px}
.linkbtn{background:none;border:0;color:var(--brand2);font-weight:800;font-size:15px;padding:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--s2);font-weight:700;font-size:16px}
.chip.on{border-color:var(--brand);background:var(--brandbg);color:var(--brand2)}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.appbtn{min-height:66px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);font-weight:800;font-size:17px;padding:4px}
.appbtn.last{border-color:var(--brand)}
.combbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.combbar b{font-variant-numeric:tabular-nums}

/* veredito */
.verdict{border-radius:22px;padding:20px 16px;text-align:center;margin-bottom:12px;border:2px solid var(--line);background:var(--s1)}
.verdict .t{font-size:38px;font-weight:900;letter-spacing:.05em;line-height:1.1}
.verdict .vs{margin-top:6px;font-size:16px;font-weight:600}
.v-ok{background:var(--okbg);border-color:var(--ok)} .v-ok .t{color:var(--ok)}
.v-warn{background:var(--warnbg);border-color:var(--warn)} .v-warn .t{color:var(--warn)}
.v-bad{background:var(--badbg);border-color:var(--bad)} .v-bad .t{color:var(--bad)}
.v-idle .t{color:var(--tx3)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.m .k{font-size:12.5px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.m .v{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.m .h{font-size:12.5px;color:var(--tx3)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-size:15px;border-left:4px solid var(--tx3)}
.alert.ok{border-left-color:var(--ok)} .alert.warn{border-left-color:var(--warn)} .alert.bad{border-left-color:var(--bad)} .alert.info{border-left-color:var(--brand)}
.alert b{font-weight:800}

/* turno */
.st{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.1em;padding:4px 12px;border-radius:999px;margin-bottom:6px}
.st.on{background:var(--okbg);color:var(--ok)} .st.pause{background:var(--warnbg);color:var(--warn)}
.stats{margin:14px 0;text-align:left}
.stat{background:var(--s2);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;background:var(--s3)}
.item .ic.g{background:var(--okbg);color:var(--ok)} .item .ic.x{background:var(--badbg);color:var(--bad)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px}
.item .tx span{font-size:13px;color:var(--tx2)}
.item .val{font-weight:900;font-variant-numeric:tabular-nums}
.del{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--tx3);font-size:22px;flex:none}

/* cofrinho */
.hero{background:linear-gradient(160deg,#1f2a1f 0%,var(--s1) 60%);border-color:#2c4a35}
.env{padding:14px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0;padding-bottom:2px}
.env .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.env .top b{font-size:16.5px}
.env .top .val{font-weight:900;font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap}
.env .sub{font-size:13.5px;color:var(--tx2);margin:4px 0 8px}
.bar{height:10px;background:var(--s3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.env .acts{display:flex;gap:8px;margin-top:10px}
.env .acts .btn{min-height:42px;font-size:15px;border-radius:11px}

/* painel */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{min-height:46px;border-radius:11px;border:0;background:transparent;font-weight:800;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx)}
.nav3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav3 button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--s1);font-size:22px;font-weight:900}
.nav3 b{text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--s2);border-radius:12px;padding:10px}
.kpi .k{font-size:11.5px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:16.5px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;text-align:right;font-weight:700;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-weight:700}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--s3);font-size:12px;margin-right:6px}
.rank.r1{background:var(--brand);color:#241002}
.heat{display:grid;grid-template-columns:62px repeat(7,1fr);gap:3px;font-size:12px}
.heat div{min-height:38px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.heat .hd{min-height:22px;color:var(--tx2);font-weight:700}
.heat .rl{justify-content:start;color:var(--tx2);font-weight:700;padding-left:2px;font-size:11.5px;text-align:left;line-height:1.1}
.heat .e{background:var(--s2);color:var(--tx3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--tx2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* mais / config */
.menu .btn{justify-content:space-between;margin-bottom:8px;background:var(--s1);border:1px solid var(--line);min-height:64px}
.menu .btn span{color:var(--tx3);font-size:22px}
.rowform{background:var(--s2);border-radius:14px;padding:10px;margin-bottom:8px}
.rowform .l1{display:flex;gap:8px;align-items:center}
.rowform .l2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.rowform .l2.two{grid-template-columns:1fr 1fr}
.rowform input.sm,.rowform select.sm{background:var(--s1)}
.rowform .note{font-size:12.5px;color:var(--tx2);margin-top:6px}
.mini{font-size:11.5px;color:var(--tx2);font-weight:700;margin:0 0 4px 2px;display:block}
.appchip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px 0 14px;border-radius:999px;background:var(--s2);border:1.5px solid var(--line);font-weight:700}
.appchip button{width:34px;height:34px;border:0;background:transparent;color:var(--tx3);font-size:20px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.tip{padding:14px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip b{display:block;font-size:16.5px;margin-bottom:3px}
.tip p{color:var(--tx2);font-size:15px}
.welcome{background:linear-gradient(160deg,#2a1a10,var(--s1) 70%);border-color:#4a2f1d}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(15,19,26,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:62px;color:var(--tx3);font-size:12.5px;font-weight:800;border-radius:12px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--brand)}
nav.tabs button.on svg{filter:drop-shadow(0 0 8px rgba(255,138,61,.35))}

/* modal e toast */
.mwrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{font-size:21px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;font-variant-numeric:tabular-nums}
.sumrow b{font-weight:800}
.sumrow.tot{border-bottom:0;font-size:20px;padding-top:12px}
.sumrow.neg b{color:var(--badtx)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#EEF2F7;color:#0B0E13;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center;font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:360px){.big{font-size:40px}.verdict .t{font-size:32px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#FF8A3D"/><path d="M12 30 15.2 5h3.6L22 30Z" fill="#241002" opacity=".9"/><path d="M17 8v4M17 16v4M17 24v4" stroke="#FFB27F" stroke-width="2" stroke-linecap="round"/></svg>
  <div class="brand"><b>Lucro na Pista</b><span id="hdrSub">Controle de quem roda de carro</span></div>
  <button class="pill" id="hdrTurno" data-act="tab" data-v="turno"><span class="dot"></span><span id="hdrTxt">Sem turno</span></button>
</header>
<div id="movendo" hidden>Carro em movimento — use o app com o carro parado.</div>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= utilidades ================= */
const KEY='lucroNaPista.v1';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  v=String(v??'').trim().replace(/\s|R\$/g,'');
  if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');
  const n=parseFloat(v);return isFinite(n)?n:0;
}
const fmt=(n,d=2)=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=n=>((+n||0)<0?'-':'')+'R$ '+fmt(Math.abs(+n||0));
const inp=(n,d=2)=>(+n)?(+n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d,useGrouping:false}):'';
const hms=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const hm=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h}h${pad(m)}`:`${m} min`};
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const fmtD=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));

/* ================= estado ================= */
function defCfg(){return{
  pronto:false,combNome:'Gasolina',combPreco:0,consumo:10,
  fixos:[
    {id:'f1',nome:'Aluguel/parcela do carro',valor:0,per:'semanal',venc:5},
    {id:'f2',nome:'Seguro',valor:0,per:'mensal',venc:10},
    {id:'f3',nome:'IPVA/licenciamento',valor:0,per:'anual',venc:1},
    {id:'f4',nome:'Plano de celular/dados',valor:0,per:'mensal',venc:10},
    {id:'f5',nome:'MEI/INSS',valor:0,per:'mensal',venc:20}
  ],
  provs:[
    {id:'p1',nome:'Óleo e filtros',custo:0,km:10000},
    {id:'p2',nome:'Pneus',custo:0,km:40000},
    {id:'p3',nome:'Freios',custo:0,km:30000},
    {id:'p4',nome:'Revisões',custo:0,km:10000},
    {id:'p5',nome:'Desgaste/depreciação',custo:0,km:20000}
  ],
  metaH:40,metaKm:2,metaMes:4000,dias:6,
  apps:['Uber','99','Lalamove','iFood','Rappi','Keeta','Shopee'],
  emergPct:5,paradoPct:5,kmModo:'gps',alertaMov:true
}}
function defState(){return{v:1,cfg:defCfg(),cofre:{fix:{},prov:{},provKm:{},comb:0,emerg:0,parado:0,hist:[]},turno:null,dias:[],regioes:[],regiaoAtual:'',ultApp:'',ultOdo:0}}
let S;
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  try{S=raw?JSON.parse(raw):defState()}catch(e){S=defState()}
  const d=defState();
  S={...d,...S};S.cfg={...d.cfg,...S.cfg};S.cofre={...d.cofre,...S.cofre};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar no aparelho')}}
let saveT=null;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,2500)}

/* ================= contas ================= */
function custoKm(){
  const c=S.cfg;
  const comb=c.consumo>0?c.combPreco/c.consumo:0;
  const prov=sum(c.provs,p=>p.km>0?p.custo/p.km:0);
  return{comb,prov,tot:comb+prov};
}
function fixoDiario(f){
  const d=Math.max(1,S.cfg.dias||1),v=+f.valor||0;
  if(!v)return 0;
  if(f.per==='semanal')return v/d;
  if(f.per==='mensal')return v*12/52/d;
  return v/52/d;
}
const fixosDia=()=>sum(S.cfg.fixos,fixoDiario);

function avaliar({valor,kmCol,kmEnt,kmVolta,min}){
  const c=S.cfg,km=kmCol+kmEnt+kmVolta;
  if(valor<=0||km<=0)return null;
  const ck=custoKm(),custo=km*ck.tot,liq=valor-custo,rkm=valor/km;
  const rh=min>0?valor/(min/60):null,liqH=min>0?liq/(min/60):null;
  const okK=rkm>=c.metaKm,okH=rh==null?null:rh>=c.metaH;
  let cor,titulo,resumo;const msgs=[];
  if(liq<=0){cor='bad';titulo='RECUSAR';resumo='Não cobre nem o custo do carro.'}
  else if(okK&&okH!==false){
    cor='ok';titulo='ACEITAR';resumo='Bate as suas metas.';
    if(okH==null)msgs.push(['info','Informe o tempo total para conferir o R$/hora.']);
  }else if(okK&&okH===false){
    cor='warn';titulo='NO LIMITE';resumo='R$/hora abaixo da meta, R$/km acima.';
    const h=min/60,sobra=(rkm-c.metaKm)*km,falta=c.metaH*h-valor;
    if(sobra>=falta)msgs.push(['ok',`A sobra por km (<b>${brl(rkm-c.metaKm)}</b>/km × ${fmt(km,1)} km = <b>${brl(sobra)}</b>) compensa os <b>${brl(falta)}</b> que faltam para a meta por hora.`]);
    else msgs.push(['warn',`A sobra por km dá <b>${brl(sobra)}</b> e cobre só <b>${fmt(clamp(sobra/falta*100,0,100),0)}%</b> dos <b>${brl(falta)}</b> que faltam na meta por hora.`]);
  }else if(!okK&&okH){
    cor='warn';titulo='NO LIMITE';resumo='Rende por hora, mas paga pouco por km.';
    msgs.push(['warn','Paga bem pelo tempo, mas desgasta mais o carro por real recebido.']);
  }else{
    const perto=rkm>=.9*c.metaKm&&(rh==null||rh>=.9*c.metaH);
    if(perto){cor='warn';titulo='NO LIMITE';resumo='Até 10% abaixo das suas metas.'}
    else{cor='bad';titulo='RECUSAR';resumo='Abaixo das suas metas.'}
  }
  if(kmCol>=3&&kmCol>kmEnt*.5)msgs.push(['info',`Coleta longe: <b>${fmt(kmCol/km*100,0)}%</b> do trajeto é só para chegar.`]);
  if(kmVolta>0)msgs.push(['info',`Incluí <b>${fmt(kmVolta,1)} km</b> de volta vazia no cálculo.`]);
  return{km,custo,liq,rkm,rh,liqH,okK,okH,cor,titulo,resumo,msgs};
}

/* turno */
const segAtivo=t=>(t.acum||0)+(t.ativoDesde?(Date.now()-t.ativoDesde)/1000:0);
function fechamento(t,km){
  const c=S.cfg,ck=custoKm(),seg=segAtivo(t);
  const itens=t.itens||[];
  const corr=itens.filter(i=>i.tipo==='corrida'),gorjs=itens.filter(i=>i.tipo==='gorjeta'),gast=itens.filter(i=>i.tipo==='gasto');
  const bruto=sum(corr,i=>i.valor),gorj=sum(gorjs,i=>i.valor);
  const abastecido=sum(gast.filter(g=>g.cat==='Combustível'),g=>g.valor);
  const outros=sum(gast.filter(g=>g.cat!=='Combustível'),g=>g.valor);
  const comb=km*ck.comb;
  const provs={};c.provs.forEach(p=>{provs[p.id]=p.km>0?km*p.custo/p.km:0});
  const manut=sum(Object.values(provs));
  const fix={};c.fixos.forEach(f=>{const v=fixoDiario(f);if(v)fix[f.id]=v});
  const fixos=sum(Object.values(fix));
  const liquido=bruto+gorj-outros-comb-manut-fixos;
  const base=Math.max(0,liquido);
  const emerg=base*(c.emergPct||0)/100,parado=base*(c.paradoPct||0)/100;
  const seu=liquido-emerg-parado;
  return{seg,km,bruto,gorj,abastecido,outros,comb,manut,provs,fixos,fix,liquido,emerg,parado,seu};
}
function liveTurno(){
  const t=S.turno;if(!t)return null;
  const seg=segAtivo(t),it=t.itens||[];
  const bruto=sum(it.filter(i=>i.tipo!=='gasto'),i=>i.valor);
  const km=t.modo==='gps'?t.km||0:null;
  return{seg,bruto,km,rh:seg>60?bruto/(seg/3600):null,rkm:km>.5?bruto/km:null,n:it.filter(i=>i.tipo==='corrida').length};
}

/* datas */
function proxVenc(f){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  if(f.per==='semanal'){const d=new Date(hoje);d.setDate(d.getDate()+((+f.venc-d.getDay()+7)%7));return d}
  if(f.per==='mensal'){
    const mk=(y,m)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(+f.venc||1,last))};
    let d=mk(hoje.getFullYear(),hoje.getMonth());if(d<hoje)d=mk(hoje.getFullYear(),hoje.getMonth()+1);return d;
  }
  return null;
}
function quando(d){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const n=Math.round((d-hoje)/864e5);
  if(n===0)return'hoje';if(n===1)return'amanhã';
  if(n<7)return`de ${DL[d.getDay()]} (em ${n} dias)`;
  return`do dia ${fmtD(d)} (em ${n} dias)`;
}
function range(modo,off){
  const now=new Date();
  if(modo==='semana'){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
    const e=new Date(d);e.setDate(e.getDate()+6);
    return{a:dkey(d),b:dkey(e),nome:(off===0?'Esta semana · ':'')+fmtD(d)+' a '+fmtD(e)};
  }
  const d=new Date(now.getFullYear(),now.getMonth()+off,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
  return{a:dkey(d),b:dkey(e),nome:(s=>s[0].toUpperCase()+s.slice(1))(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})),d,e};
}

function alertas(){
  const c=S.cfg,K=S.cofre,out=[];
  c.fixos.filter(f=>+f.valor>0).forEach(f=>{
    const s=K.fix[f.id]||0,falta=f.valor-s,d=proxVenc(f);
    if(d){
      if(falta>0.009)out.push(['warn',`Faltam <b>${brl(falta)}</b> para ${esc(f.nome.toLowerCase())} ${quando(d)}.`,d]);
      else out.push(['ok',`${esc(f.nome)} ${quando(d)} já está guardado.`,d]);
    }
  });
  c.provs.filter(p=>+p.custo>0&&+p.km>0).forEach(p=>{
    const kd=K.provKm[p.id]||0,rest=p.km-kd;
    if(rest<=p.km*.15)out.push([rest<=0?'bad':'warn',rest<=0?`${esc(p.nome)}: passou <b>~${fmt(-rest,0)} km</b> do intervalo. Hora do serviço.`:`${esc(p.nome)}: serviço em <b>~${fmt(rest,0)} km</b>. Provisão em ${fmt(clamp((K.prov[p.id]||0)/p.custo*100,0,999),0)}%.`,null]);
  });
  return out.sort((a,b)=>({bad:0,warn:1,ok:2}[a[0]]-{bad:0,warn:1,ok:2}[b[0]]));
}

/* ================= tela: Painel ================= */
const pv={modo:'semana',off:0};
function agreg(dias){
  const a={dias:dias.length,seg:sum(dias,d=>d.seg),km:sum(dias,d=>d.km),bruto:sum(dias,d=>d.bruto+d.gorj),
    gastos:sum(dias,d=>d.outros+d.comb),prov:sum(dias,d=>d.manut+d.fixos),liquido:sum(dias,d=>d.liquido),seu:sum(dias,d=>d.seu),reservas:sum(dias,d=>d.emerg+d.parado)};
  a.rh=a.seg>0?a.bruto/(a.seg/3600):0;a.rkm=a.km>0?a.bruto/a.km:0;return a;
}
function porApp(dias){
  const m={};
  dias.forEach(d=>(d.corridas||[]).forEach(i=>{
    const r=m[i.app]||(m[i.app]={app:i.app,n:0,valor:0,seg:0,km:0});
    r.valor+=i.valor;if(i.tipo==='corrida'){r.n++;r.seg+=i.seg||0;r.km+=i.km||0}
  }));
  return Object.values(m).map(r=>({...r,rh:r.seg>0?r.valor/(r.seg/3600):0,rkm:r.km>0?r.valor/r.km:0})).sort((a,b)=>b.rh-a.rh);
}
const FAIXAS=[[0,6,'Madrug.'],[6,11,'Manhã'],[11,14,'Almoço'],[14,18,'Tarde'],[18,22,'Noite'],[22,24,'Fim noite']];
let heatApp='';
function heatData(){
  const g={};
  S.dias.forEach(d=>(d.corridas||[]).forEach(i=>{
    if(i.tipo!=='corrida'||!(i.seg>0))return;
    if(heatApp&&i.app!==heatApp)return;
    const mid=new Date(i.t-i.seg*500),h=mid.getHours(),wd=(mid.getDay()+6)%7;
    const fi=FAIXAS.findIndex(f=>h>=f[0]&&h<f[1]),k=fi+'_'+wd;
    const c=g[k]||(g[k]={v:0,s:0,n:0});c.v+=i.valor;c.s+=i.seg;c.n++;
  }));
  return g;
}
function heatCell(c){
  if(!c)return'<div class="e">·</div>';
  const rh=c.v/(c.s/3600),r=rh/S.cfg.metaH;
  const col=r>=1?`rgba(34,197,94,${clamp(.3+(r-1)*1.2,.3,.9)})`:r>=.8?`rgba(250,204,21,${clamp(.25+(r-.8)*2,.25,.6)})`:`rgba(244,63,94,${clamp(.25+(.8-r),.25,.7)})`;
  return`<div style="background:${col}" title="${c.n} corridas">${fmt(rh,0)}</div>`;
}
function vPainel(){
  const R=range(pv.modo,pv.off),dias=S.dias.filter(d=>d.data>=R.a&&d.data<=R.b),A=agreg(dias),c=S.cfg;
  const meta=pv.modo==='mes'?c.metaMes:c.metaMes*12/52,pct=meta>0?A.liquido/meta*100:0;
  let proj='';
  if(pv.modo==='mes'&&pv.off===0&&A.dias>0&&R.e){
    const diasMes=R.e.getDate(),prev=A.liquido/A.dias*(c.dias/7*diasMes);
    proj=`<p class="small muted mt">No seu ritmo (${brl(A.liquido/A.dias)} por dia trabalhado, ${c.dias} dias/semana): <b class="${prev>=meta?'c-ok':'c-warn'}">${brl(prev)}</b> no mês.</p>`;
  }
  const apps=porApp(dias),hd=heatData(),regs=porRegiao();
  return`<div class="seg"><button class="${pv.modo==='semana'?'on':''}" data-act="pvModo" data-v="semana">Semana</button><button class="${pv.modo==='mes'?'on':''}" data-act="pvModo" data-v="mes">Mês</button></div>
  <div class="nav3"><button data-act="pvOff" data-v="-1" aria-label="Anterior">‹</button><b>${R.nome}</b><button data-act="pvOff" data-v="1" aria-label="Próximo" ${pv.off>=0?'disabled style="opacity:.3"':''}>›</button></div>
  <div class="card">
    <h2>Meta de lucro líquido ${pv.modo==='mes'?'do mês':'da semana'}</h2>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><div class="big" style="font-size:36px">${brl(A.liquido)}</div><div class="muted small">de ${brl(meta)}</div></div>
    <div class="mt">${envBar(pct,pct>=100?'ok':'')}</div>
    <p class="small muted mt">${fmt(clamp(pct,0,999),0)}% da meta${pct<100&&meta>0?` · faltam ${brl(meta-A.liquido)}`:''}</p>${proj}
  </div>
  ${A.dias?`<div class="card"><h2>Resumo · ${A.dias} ${A.dias>1?'turnos':'turno'}</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Bruto</div><div class="v">${brl(A.bruto)}</div></div>

      <div class="kpi"><div class="k">Líquido</div><div class="v ${A.liquido>=0?'c-ok':'c-bad'}">${brl(A.liquido)}</div></div>
      <div class="kpi"><div class="k">Reservas</div><div class="v">${brl(A.reservas)}</div></div>
      <div class="kpi"><div class="k">Seu de verdade</div><div class="v">${brl(A.seu)}</div></div>
      <div class="kpi"><div class="k">Horas</div><div class="v">${hm(A.seg)}</div></div>
      <div class="kpi"><div class="k">Km</div><div class="v">${fmt(A.km,0)}</div></div>
      <div class="kpi"><div class="k">R$/h · R$/km</div><div class="v"><span class="${statC(A.rh,c.metaH)}">${fmt(A.rh,0)}</span> · <span class="${statC(A.rkm,c.metaKm)}">${fmt(A.rkm)}</span></div></div>
    </div></div>`:`<div class="alert info"><div>Nenhum turno encerrado neste período.</div></div>`}
  ${apps.length?`<div class="card"><h2>Ranking por app (${pv.modo==='mes'?'mês':'semana'})</h2>
    <table><tr><th>App</th><th>Corr.</th><th>Bruto</th><th>R$/h</th><th>R$/km</th></tr>
    ${apps.map((r,i)=>`<tr><td><span class="rank ${i===0?'r1':''}">${i+1}</span>${esc(r.app)}</td><td>${r.n}</td><td>${fmt(r.valor,0)}</td><td class="${statC(r.rh,c.metaH)}">${r.rh?fmt(r.rh,0):'—'}</td><td class="${statC(r.rkm,c.metaKm)}">${r.rkm?fmt(r.rkm):'—'}</td></tr>`).join('')}</table>
    <p class="tiny faint mt">O tempo de cada corrida conta desde o lançamento anterior (sem pausas).</p></div>`:''}
  <div class="card"><h2>Mapa de horários · R$/hora</h2>
    <select class="sm mb" data-act-change="heatApp"><option value="">Todos os apps</option>${c.apps.map(a=>`<option ${heatApp===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
    ${Object.keys(hd).length?`<div class="heat"><div class="hd"></div>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="hd">${d}</div>`).join('')}
    ${FAIXAS.map((f,fi)=>`<div class="rl">${f[2]}<br><span class="faint">${f[0]}–${f[1]}h</span></div>`+[0,1,2,3,4,5,6].map(w=>heatCell(hd[fi+'_'+w])).join('')).join('')}</div>
    <div class="legend"><span><i style="background:rgba(34,197,94,.7)"></i>Bate a meta</span><span><i style="background:rgba(250,204,21,.5)"></i>Perto</span><span><i style="background:rgba(244,63,94,.55)"></i>Abaixo</span></div>
    <p class="tiny faint mt">Todo o histórico. Quanto mais turnos, mais confiável.</p>`:`<p class="muted small">Aparece depois dos primeiros turnos encerrados.</p>`}
  </div>
  ${regs.length?`<div class="card"><h2>Melhores regiões de coleta</h2><table><tr><th>Região</th><th>Corr.</th><th>R$/h</th><th>Média</th></tr>
    ${regs.slice(0,10).map((r,i)=>`<tr><td><span class="rank ${i===0?'r1':''}">${i+1}</span>${esc(r.nome)}</td><td>${r.n}</td><td class="${statC(r.rh,c.metaH)}">${r.rh?fmt(r.rh,0):'—'}</td><td>${fmt(r.valor/r.n)}</td></tr>`).join('')}</table></div>`:''}
  ${dias.length?`<div class="card"><h2>Turnos do período</h2>${[...dias].reverse().map(d=>`<div class="item"><div class="ic">${DS[fromKey(d.data).getDay()]}</div><div class="tx"><b>${fmtD(fromKey(d.data))} · ${brl(d.bruto+d.gorj)}</b><span>${hm(d.seg)} · ${fmt(d.km,0)} km · líquido ${brl(d.liquido)}</span></div><button class="del" data-act="delDia" data-v="${d.id}" aria-label="Apagar turno">×</button></div>`).join('')}</div>`:''}`;
}
function porRegiao(){
  const m={};
  S.dias.forEach(d=>(d.corridas||[]).forEach(i=>{if(i.tipo!=='corrida'||!i.regiao)return;const r=m[i.regiao]||(m[i.regiao]={nome:i.regiao,n:0,valor:0,seg:0});r.n++;r.valor+=i.valor;r.seg+=i.seg||0}));
  return Object.values(m).map(r=>({...r,rh:r.seg>0?r.valor/(r.seg/3600):0})).sort((a,b)=>b.rh-a.rh);
}

function vDicas(){
  const tips=[],apps=porApp(S.dias);
  if(apps.length>1&&apps[0].rh)tips.push(['Seu app mais rentável',`Até agora, <b>${esc(apps[0].app)}</b> rendeu <b>${brl(apps[0].rh)}/h</b> para você, contra ${brl(apps[apps.length-1].rh)}/h em ${esc(apps[apps.length-1].app)}.`]);
  const hd=heatData();let best=null;
  Object.entries(hd).forEach(([k,c])=>{if(c.n<3)return;const rh=c.v/(c.s/3600);if(!best||rh>best.rh)best={k,rh}});
  if(best){const[fi,w]=best.k.split('_').map(Number);tips.push(['Seu melhor horário',`<b>${['segunda','terça','quarta','quinta','sexta','sábado','domingo'][w]}, ${FAIXAS[fi][2].toLowerCase()} (${FAIXAS[fi][0]}h–${FAIXAS[fi][1]}h)</b>: média de ${brl(best.rh)}/h.`])}
  const regs=porRegiao();if(regs.length>1&&regs[0].n>=3)tips.push(['Sua melhor região de coleta',`<b>${esc(regs[0].nome)}</b>: ${brl(regs[0].rh)}/h em ${regs[0].n} corridas.`]);
  return`${back}${tips.length?`<div class="card hero"><h2>Pelos seus números</h2>${tips.map(t=>`<div class="tip"><b>${t[0]}</b><p>${t[1]}</p></div>`).join('')}</div>`:''}
  <div class="card"><h2>Dicas para melhores corridas</h2>${DICAS.map(t=>`<div class="tip"><b>${t[0]}</b><p>${t[1]}</p></div>`).join('')}</div>`;
}

function csv(rows){return'﻿'+rows.map(r=>r.map(v=>{v=typeof v==='number'?String(+v.toFixed(2)).replace('.',','):String(v??'');return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n')}
async function baixar(nome,texto,tipo){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{
      const r=await C.Plugins.Filesystem.writeFile({path:nome,data:texto,directory:'CACHE',encoding:'utf8'});
      await C.Plugins.Share.share({title:nome,url:r.uri,dialogTitle:'Salvar ou enviar'});return;
    }catch(e){if(String(e&&e.message||e).toLowerCase().includes('cancel'))return}
  }
  try{
    const b=new Blob([texto],{type:tipo}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Arquivo gerado');
  }catch(e){
    try{await navigator.clipboard.writeText(texto);toast('Copiado para a área de transferência')}catch(_){toast('Não consegui gerar o arquivo')}
  }
}

/* ================= ações ================= */
function lancar(tipo,valor,extra={}){
  const t=S.turno;if(!t){toast('Inicie o turno primeiro');return false}
  if(!(valor>0)){toast('Digite o valor');return false}
  const it={id:uid(),t:Date.now(),tipo,valor,...extra};
  if(tipo==='corrida'){
    const s=segAtivo(t);it.seg=Math.round(s-(t.marcoSeg||0));t.marcoSeg=s;
    if(t.modo==='gps'){it.km=+((t.km||0)-(t.marcoKm||0)).toFixed(2);t.marcoKm=t.km||0}
    if(S.regiaoAtual)it.regiao=S.regiaoAtual;
    S.ultApp=it.app;
  }
  t.itens.push(it);save();return true;
}
function iniciar(){
  const c=S.cfg,t={inicio:Date.now(),ativoDesde:Date.now(),acum:0,modo:c.kmModo,km:0,marcoSeg:0,marcoKm:0,itens:[]};
  if(c.kmModo==='odo'){const o=num($('#odoIni')&&$('#odoIni').value);if(!(o>0)){toast('Digite o odômetro');return}t.odoIni=o;S.ultOdo=o}
  S.turno=t;save();gpsSync();wake();render();toast('Turno iniciado. Bom trabalho!');
}
function modalEncerrar(){
  const t=S.turno;if(!t)return;
  const gps=t.modo==='gps';
  openModal(`<h3>Encerrar turno</h3>
    ${gps?`<div class="field"><label for="encKm">Km rodados (GPS mediu ${fmt(t.km||0,1)})</label><input id="encKm" inputmode="decimal" value="${inp(t.km||0,1)}"></div>`
    :`<div class="field"><label for="encOdo">Odômetro agora (início ${fmt(t.odoIni,1)})</label><input id="encOdo" inputmode="decimal" placeholder="Ex.: ${fmt(t.odoIni+120,0)}"></div>`}
    <div id="encRes" class="mt"></div>
    <button class="btn pri xl" data-act="encConfirma">Encerrar e separar no cofrinho</button>
    <button class="btn ghost mt" data-act="mclose">Continuar rodando</button>`);
  updEnc();
}
function kmEnc(){
  const t=S.turno;if(!t)return 0;
  if(t.modo==='gps')return Math.max(0,num($('#encKm')&&$('#encKm').value));
  const o=num($('#encOdo')&&$('#encOdo').value);return o>t.odoIni?o-t.odoIni:0;
}
function updEnc(){
  const box=$('#encRes');if(!box||!S.turno)return;
  const F=fechamento(S.turno,kmEnc()),c=S.cfg;
  const row=(k,v,neg,cls='')=>`<div class="sumrow ${neg?'neg':''} ${cls}"><span>${k}</span><b>${neg?'−':''}${brl(v)}</b></div>`;
  box.innerHTML=`<div class="kpis mb"><div class="kpi"><div class="k">Tempo</div><div class="v">${hm(F.seg)}</div></div><div class="kpi"><div class="k">R$/h</div><div class="v ${statC(F.seg?(F.bruto+F.gorj)/(F.seg/3600):0,c.metaH)}">${F.seg>60?fmt((F.bruto+F.gorj)/(F.seg/3600),0):'—'}</div></div><div class="kpi"><div class="k">R$/km</div><div class="v ${statC(F.km?(F.bruto+F.gorj)/F.km:null,c.metaKm)}">${F.km>0?fmt((F.bruto+F.gorj)/F.km):'—'}</div></div></div>
  ${row('Faturamento bruto',F.bruto)}${F.gorj?row('Gorjetas',F.gorj):''}
  ${row(`Combustível (${fmt(F.km,1)} km)`,F.comb,1)}${F.outros?row('Outros gastos',F.outros,1):''}
  ${row('Provisão de manutenção',F.manut,1)}${row('Contas fixas do dia',F.fixos,1)}
  ${row('Lucro líquido',F.liquido,0,'tot')}
  ${row('Reserva de emergência',F.emerg,1)}${row('Reserva dias parados',F.parado,1)}
  <div class="sumrow tot"><span>Seu de verdade</span><b class="${F.seu>=0?'c-ok':'c-bad'}">${brl(F.seu)}</b></div>
  ${F.abastecido?`<p class="tiny faint">Abasteceu ${brl(F.abastecido)} hoje: sai do envelope de combustível.</p>`:''}
  ${F.km===0?`<div class="alert warn mt"><div>Sem km informado, combustível e manutenção ficam zerados.</div></div>`:''}`;
}
function encerrar(){
  const t=S.turno;if(!t)return;
  if(t.modo==='odo'){const o=num($('#encOdo').value);if(!(o>t.odoIni)){toast('Odômetro final precisa ser maior que o inicial');return}S.ultOdo=o}
  if(t.ativoDesde){t.acum=segAtivo(t);t.ativoDesde=null}
  const km=kmEnc(),F=fechamento(t,km),K=S.cofre;
  const corr=t.itens.filter(i=>i.tipo!=='gasto').map(i=>({...i}));
  const cs=corr.filter(i=>i.tipo==='corrida'),somaSeg=sum(cs,i=>i.seg||0),gpsKm=sum(cs,i=>i.km||0);
  cs.forEach(i=>{
    if(t.modo==='gps'&&gpsKm>0)i.km=+((i.km||0)*km/(t.km||gpsKm)).toFixed(2);
    else i.km=somaSeg>0?+(km*(i.seg||0)/somaSeg).toFixed(2):0;
  });
  const gastos=t.itens.filter(i=>i.tipo==='gasto');
  const aloc={comb:F.comb-F.abastecido,fix:F.fix,prov:F.provs,km,emerg:F.emerg,parado:F.parado};
  K.comb+=aloc.comb;
  Object.entries(F.fix).forEach(([k,v])=>K.fix[k]=(K.fix[k]||0)+v);
  Object.entries(F.provs).forEach(([k,v])=>{K.prov[k]=(K.prov[k]||0)+v;K.provKm[k]=(K.provKm[k]||0)+km});
  K.emerg+=F.emerg;K.parado+=F.parado;
  const dia={id:uid(),data:dkey(t.inicio),inicio:t.inicio,fim:Date.now(),seg:Math.round(F.seg),km,bruto:F.bruto,gorj:F.gorj,abastecido:F.abastecido,outros:F.outros,comb:F.comb,manut:F.manut,fixos:F.fixos,liquido:F.liquido,emerg:F.emerg,parado:F.parado,seu:F.seu,corridas:corr,gastos,aloc};
  S.dias.push(dia);S.turno=null;save();gpsSync();unwake();closeModal();
  $('#movendo').hidden=true;
  go('cofre');toast(`Turno encerrado. Seu de verdade: ${brl(F.seu)}`);
}
function delDia(id){
  const i=S.dias.findIndex(d=>d.id===id);if(i<0)return;
  const d=S.dias[i],a=d.aloc||{},K=S.cofre;
  K.comb-=a.comb||0;K.emerg-=a.emerg||0;K.parado-=a.parado||0;
  Object.entries(a.fix||{}).forEach(([k,v])=>K.fix[k]=(K.fix[k]||0)-v);
  Object.entries(a.prov||{}).forEach(([k,v])=>{K.prov[k]=(K.prov[k]||0)-v;K.provKm[k]=Math.max(0,(K.provKm[k]||0)-(a.km||0))});
  S.dias.splice(i,1);save();render();toast('Turno apagado e cofrinho ajustado');
}

  gasto:b=>{const e=$('#gValor'),v=num(e.value);if(lancar('gasto',v,{cat:b.dataset.v})){render();toast(`${b.dataset.v}: ${brl(v)}`)}else e.focus()},
  delItem:b=>{const t=S.turno;const i=t.itens.findIndex(x=>x.id===b.dataset.v);if(i<0)return;const it=t.itens[i];

  zerarOk:()=>{if($('#zConf').value.trim().toUpperCase()!=='APAGAR'){toast('Digite APAGAR');return}S=defState();save();closeModal();gpsSync();go('mais','config')}

});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='temVolta'){calc.temVolta=el.checked;$('#voltaBox').hidden=!el.checked;updVeredito();if(el.checked)$('#c_volta').focus()}
  if(el.dataset.actChange==='cfgRe'){lerCfg();const f=draft.fixos[+el.dataset.fx];f.venc=f.per==='semanal'?5:10;render()}
  if(el.dataset.actChange==='heatApp'){heatApp=el.value;render()}
  if(el.id==='restFile'&&el.files[0]){
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.cfg||!Array.isArray(o.dias))throw 0;
      openModal(`<h3>Restaurar backup?</h3><p class="muted mb">Backup com ${o.dias.length} turnos. Os dados atuais deste aparelho serão substituídos.</p><div class="grid2"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" id="restOk">Restaurar</button></div>`);
      $('#restOk').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(o));load();closeModal();gpsSync();go('vale');toast('Backup restaurado')};
    }catch(_){toast('Arquivo de backup inválido')}};r.readAsText(el.files[0]);el.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='askV')ACT.askOk();else if(id==='mcP'||id==='mcC')ACT.mCombOk();else if(id==='regIn')ACT.regOk();else if(id==='novoApp')ACT.cfgAddApp();
  else if(id==='lValor'||id==='gValor'||e.target.dataset.calc)e.target.blur();
});

/* ================= GPS, tela ligada ================= */
let watchId=null,lastPos=null,wakeLock=null,lastMov=0;
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function gpsSync(){
  const t=S.turno,need=t&&(t.modo==='gps'||S.cfg.alertaMov);
  if(need&&watchId==null&&navigator.geolocation){
    watchId=navigator.geolocation.watchPosition(onPos,err=>{if(err.code===1&&S.turno&&S.turno.modo==='gps')toast('Permita a localização para medir os km pelo GPS')},{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  }else if(!need&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;lastPos=null}
}
function onPos(p){
  const t=S.turno;if(!t)return;
  const{latitude:la,longitude:lo,accuracy:ac}=p.coords;let sp=p.coords.speed;
  if(lastPos&&(sp==null||isNaN(sp))){const dt=(p.timestamp-lastPos.ts)/1000;if(dt>0)sp=hav(lastPos.la,lastPos.lo,la,lo)/dt}
  if(S.cfg.alertaMov&&sp!=null&&ac<=50){const mov=sp>4.5;if(mov)lastMov=Date.now();$('#movendo').hidden=!mov}
  if(t.modo!=='gps'||!t.ativoDesde){lastPos={la,lo,ts:p.timestamp};return}
  if(ac>40)return;
  if(!lastPos){lastPos={la,lo,ts:p.timestamp};return}
  const d=hav(lastPos.la,lastPos.lo,la,lo),dt=(p.timestamp-lastPos.ts)/1000;
  if(d<Math.max(15,ac*.8))return;
  if(dt>0&&d/dt>55){lastPos={la,lo,ts:p.timestamp};return}
  t.km=(t.km||0)+d/1000;lastPos={la,lo,ts:p.timestamp};saveSoon();
}
async function wake(){try{if(S.turno&&'wakeLock'in navigator&&document.visibilityState==='visible')wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();render()}else save()});
setInterval(()=>{tick();if(Date.now()-lastMov>12000)$('#movendo').hidden=true},1000);

/* botão voltar do Android */
(function(){
  const C=window.Capacitor;const A=C&&C.Plugins&&C.Plugins.App;if(!A)return;
  A.addListener('backButton',()=>{
    if($('#modal').innerHTML){closeModal();return}
    if(tab==='mais'&&sub&&S.cfg.pronto){draft=null;go('mais');return}
    if(tab!=='vale'&&S.cfg.pronto){go('vale');return}
    save();A.minimizeApp?A.minimizeApp():A.exitApp();
  });
})();

/* início */
load();
if(S.turno){gpsSync();wake()}
render();
window.addEventListener('pagehide',save);
</script>
